<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sofiia C — Graphic design &amp; illustration</title>
    <meta name="description" content="Sofiia C — graphic design and illustration.">
    <link rel="preload" as="image" href="assets/hero.webp">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="hero">
        <div class="hero__frame">
            <!-- The artwork carries the hand-lettered name.
                 To use a different painting, replace assets/hero.webp. -->
            <img class="hero__art" src="assets/hero.webp"
                 alt="Hand-painted night sky with clouds and stars, hand-lettered “Sofiia C”">

            <!-- The name is real text for search engines and screen readers only;
                 visually it is part of the artwork. -->
            <h1 class="visually-hidden">Sofiia C</h1>

            <p class="hero__tagline">Graphic design &amp; illustration</p>
        </div>
    </main>
</body>

</html>
